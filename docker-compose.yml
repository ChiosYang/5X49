services:
  backend:
    image: ${DOCKER_USERNAME:-alicolia}/5x49-backend:latest
    container_name: 5x49-backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-11548}:8000"
    volumes:
      - backend_data:/app/data
      - type: bind
        source: ${MEDIA_DIR:-./media}
        target: /media
        read_only: ${MEDIA_READ_ONLY:-true}
        bind:
          create_host_path: false
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_SCRAPE_CONCURRENCY=${TMDB_SCRAPE_CONCURRENCY:-3}
      - TMDB_API_REQUESTS_PER_SECOND=${TMDB_API_REQUESTS_PER_SECOND:-6}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-openrouter/pony-alpha}
      - API_BASE_URL=${API_BASE_URL:-https://openrouter.ai/api/v1}
      - MEDIA_DIR=/media
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5549}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKER_USERNAME:-alicolia}/5x49-frontend:latest
    container_name: 5x49-frontend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5549}:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
